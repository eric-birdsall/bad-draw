<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8e5d9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Drunk Drawing</title>
  </head>
  <body>
    <main class="bad-draw">
      <header class="masthead">
        <h1><img class="logo" src="/src/main-logo.png" alt="Drunk Drawing" /></h1>
        <p>Drawing, under the influence</p>
      </header>

      <section class="bad-draw-intro">
        <div class="sketch-preview" aria-hidden="true">
          <canvas width="480" height="340" data-preview></canvas>
        </div>
        <div class="round-setup">
          <h2 data-heading></h2>
          <p data-description></p>
          <div class="difficulty" data-setup>
            <div
              class="difficulty-buttons"
              role="radiogroup"
              aria-label="Difficulty"
              data-difficulty
            >
              <button type="button" role="radio" aria-checked="false" value="easy">Easy</button>
              <button type="button" role="radio" aria-checked="true" value="medium">Medium</button>
              <button type="button" role="radio" aria-checked="false" value="hard">Hard</button>
            </div>
            <button
              type="button"
              class="settings-button"
              data-settings
              aria-label="Settings"
              title="Settings"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M19.11 9.32 L21.76 9.82 L21.76 14.18 L19.11 14.68 L18.92 15.14 L20.44 17.36 L17.36 20.44 L15.14 18.92 L14.68 19.11 L14.18 21.76 L9.82 21.76 L9.32 19.11 L8.86 18.92 L6.64 20.44 L3.56 17.36 L5.08 15.14 L4.89 14.68 L2.24 14.18 L2.24 9.82 L4.89 9.32 L5.08 8.86 L3.56 6.64 L6.64 3.56 L8.86 5.08 L9.32 4.89 L9.82 2.24 L14.18 2.24 L14.68 4.89 L15.14 5.08 L17.36 3.56 L20.44 6.64 L18.92 8.86Z"
                />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
            <small data-difficulty-note></small>
          </div>
          <div class="actions">
            <strong class="secret-word" data-word hidden></strong>
            <button type="button" data-peek hidden>
              Hold to reveal
            </button>
            <button type="button" class="primary" data-next>
              Continue
            </button>
            <button type="button" data-leave hidden>Back</button>
          </div>
        </div>
      </section>

      <section class="bad-draw-play" hidden aria-label="Drawing round">
        <header class="round-bar">
          <div class="bad-draw-clock">
            <span>Time left</span><strong data-time role="timer"></strong>
          </div>
          <button type="button" data-exit>Exit round</button>
        </header>
        <div class="workspace">
          <div class="paper-column">
            <div class="paper-row">
              <div class="drunk-meter" role="img" aria-label="Drunk meter: Sober">
                <span data-drunk>Sober</span>
                <div class="mug" aria-hidden="true">
                  <div class="mug-inside"><div class="beer"></div></div>
                </div>
              </div>
              <div class="bad-draw-sheet">
                <canvas aria-label="Drawing paper"></canvas>
                <span class="bad-draw-cursor" aria-hidden="true" hidden></span>
                <span class="bad-draw-hic" aria-hidden="true">hic!</span>
              </div>
            </div>
            <footer>
              <p>Drag your finger to draw</p>
              <div class="actions">
                <button type="button" data-undo>
                  Undo · <span></span>
                </button>
                <button type="button" data-clear>
                  Clear · <span></span>
                </button>
                <button type="button" class="primary" data-correct>
                  Correct!
                </button>
              </div>
            </footer>
          </div>
        </div>
      </section>

      <section class="result-card" hidden aria-labelledby="result-heading">
        <p data-outcome></p>
        <h2 id="result-heading" data-answer></h2>
        <img class="bad-draw-snapshot" alt="Final drawing" />
        <dl class="result-stats">
          <div>
            <dt>Points</dt>
            <dd data-score></dd>
          </div>
          <div>
            <dt>Time left</dt>
            <dd data-remaining></dd>
          </div>
        </dl>
        <button type="button" class="primary" data-again>
          Play again
        </button>
      </section>
    </main>

    <dialog class="bad-draw-dev" aria-labelledby="dev-title">
      <form method="dialog">
        <h2 id="dev-title">Settings</h2>
        <div class="bad-draw-dev-controls"></div>
        <div class="actions">
          <button type="button" data-dev-reset>Reset to preset</button>
          <button class="primary">Done</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/badDraw.js"></script>
  </body>
</html>
